<div class="auth-container">
    <div class="auth-card">
        <h2>Создать аккаунт</h2>
        <p class="auth-subtitle">Регайся и открывай МОИ КЕЙСЫ </p>


        <!--ошибка-->
        <div class="error-alert" *ngIf="errorMessage">
            {{ errorMessage }}
        


            <!--ПОКАЗЫВАЕТСЯ ТОЛЬКО ЕСЛИ ЮЗЕР ЕСТЬ В БД-->
            <div *ngIf="isUserAlreadyExists" class="already-exists-actions">
                <p class="hint-text">Есть вариант шо ты код не ввел так шо иди вводи (кнопка ниже)</p>
                <button type="button" class="btn-goto-login" (click)="resendCode()"> 
                    Получить нью коооод (Без курымдыка не дам)
                </button>
            </div>
        </div>



        <form *ngIf="!isCodeSent" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input
                type="text"
                id="username"
                name="username"
                [(ngModel)]="userData.username"
                placeholder="Придумай логин"
                required
                />

            </div>
            
            
            <div class="form-group">
                <label for="email">Почта</label>
                <input
                type="email"
                id="email"
                name="email"
                [(ngModel)]="userData.email"
                placeholder="name@example.com"
                required
                />

            </div>

              <div class="form-group">
                <label for="password">Пароль</label>
                <div class="password-wrapper">
                    <input
                        [type]="showPassword ? 'text' : 'password'"
                        id="password"
                        name="password"
                        [(ngModel)]="userData.password"
                        placeholder="Создай пароль"
                        required
                    />
                    <button 
                        type="button" 
                        class="toggle-password" 
                        (click)="togglePasswordVisibility()"
                        aria-label="видимость пароля">
                        <!-- svg глаз открытого  закрытого -->
                        <svg *ngIf="!showPassword" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg *ngIf="showPassword" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                    
            </div>
            <div class="form-group">
                <label for="confirmPassword">Повтори пароль</label>
                <div class="password-wrapper">
                    <input
                        [type]="showConfirmPassword ? 'text' : 'password'"
                        id="confirmPassword"
                        name="confirmPassword"
                        [(ngModel)]="userData.confirmPassword"
                        placeholder="Повтори пароль"
                        required
                    />

                    <button 
                    type="button" 
                    class="toggle-password" 
                    (click)="toggleConfirmPasswordVisibility()"
                    aria-label="Переключить видимость повторного пароля">
                    <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>

                </div>
            
            </div>

            <button type="submit" class="btn-submit" [disabled]="isLoading">
                <span *ngIf="!isLoading">Зарегистрироваться</span>
                <span *ngIf="isLoading">Создание...</span>

            </button>
        </form>

        <form *ngIf="isCodeSent" (ngSubmit)="onConfirmCode()">
            <div class="form-group">
                <label for="code">Код подтверждения</label>
                <input
                    type="text"
                    id="code"
                    name="code"
                    [(ngModel)]="confirmCode"
                    placeholder="234567"
                    maxlength="6"
                    style="text-align: center; letter-spacing: 6px; font-size: 1.4rem;"
                    required
                    />
            </div>

            <button type="submit" class="btn-submit" [disabled]="isLoading">
                <span *ngIf="!isLoading">Се фа ин заходи</span>
                <span *ngIf="isLoading">Проверяю код (лично)</span>
            </button>
        </form>


        <div class="auth-footer">
            <span>Уже есть акк?(красава)</span>
            <a routerLink="/login">Войти</a>
        </div>
    </div>
</div>
